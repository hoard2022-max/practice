<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게임 모음</title>
<style>
  :root{--bg:#07060f;--fg:#eef0ff;--dim:#9a9cc0;--line:rgba(255,255,255,.12)}
  html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 30%,#21124a,#07060f 70%) fixed;color:var(--fg);
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:56px 16px}
  h1{font-size:clamp(32px,7vw,52px);margin:0 0 8px;font-weight:900;
    background:linear-gradient(90deg,#5ef0ff,#b07cff,#ff5fa8);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{color:var(--dim);margin:0 0 32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  a.card{display:block;text-decoration:none;color:inherit;padding:24px;border-radius:18px;
    background:rgba(16,13,36,.85);border:1px solid var(--line);transition:transform .15s,border-color .15s,box-shadow .15s}
  a.card:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 10px 30px color-mix(in srgb,var(--c) 35%,transparent)}
  .icon{font-size:40px}
  h2{margin:12px 0 6px;font-size:22px;color:var(--c)}
  .card p{margin:0;color:#c9cbe8;font-size:14px;line-height:1.6}
  .play{display:inline-block;margin-top:16px;padding:8px 16px;border-radius:10px;background:var(--c);color:#0b0820;font-weight:800}
</style>
</head>
<body>
<main>
  <h1>게임 모음</h1>
  <p class="sub">브라우저에서 바로 플레이할 수 있는 게임들입니다.</p>
  <div class="grid">
    <a class="card" href="rhythm-game.html" style="--c:#5ef0ff">
      <div class="icon">🎹</div>
      <h2>펄스 레인</h2>
      <p>7키 건반 리듬게임. 오리지널 일렉트로닉 곡에 맞춰 떨어지는 노트를 쳐 보세요. 쉬움 · 보통 · 어려움.</p>
      <span class="play">플레이 ▶</span>
    </a>
    <a class="card" href="sky-fighter.html" style="--c:#ff5fa8">
      <div class="icon">✈️</div>
      <h2>스카이 파이터</h2>
      <p>하늘을 나는 슈팅 게임. 적을 피하고 격추하세요.</p>
      <span class="play">플레이 ▶</span>
    </a>
  </div>
</main>
</body>
</html>
